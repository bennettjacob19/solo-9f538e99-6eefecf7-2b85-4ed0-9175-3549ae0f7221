name: dns-srv-duty

# Three roles share one image and one SQLite state plane on the `dnsdata`
# volume:
#   auth     -- local authoritative endpoint (UDP 5354): SRV + glue A, with a
#               config-version TXT on every answer; behaviour switched live
#   resolver -- atomic-group caching resolver (UDP 5353, published):
#               shared 2s fetch budget, concurrent A back-fill, same-version
#               validation, whole-group expiry
#   web      -- FastAPI operations console (HTTP 8000, published)

services:
  auth:
    build: .
    command: ["python", "-m", "app.auth_server"]
    environment:
      DB_PATH: /data/app.db
      FIXED_DOMAIN: service.example
      AUTH_PORT: "5354"
      SRV_TTL: "10"
      GLUE_TTL: "5"
    volumes:
      - dnsdata:/data
    restart: unless-stopped

  resolver:
    build: .
    command: ["python", "-m", "app.resolver"]
    environment:
      DB_PATH: /data/app.db
      FIXED_DOMAIN: service.example
      RESOLVER_PORT: "5353"
      AUTH_HOST: auth
      AUTH_PORT: "5354"
      FETCH_BUDGET: "2"   # one shared 2s budget from the first upstream query
      SRV_TTL: "10"
      GLUE_TTL: "5"
    ports:
      - "5353:5353/udp"
    volumes:
      - dnsdata:/data
    depends_on:
      - auth
    restart: unless-stopped

  web:
    build: .
    command: ["python", "-m", "app.web"]
    environment:
      DB_PATH: /data/app.db
      FIXED_DOMAIN: service.example
      WEB_PORT: "8000"
      RESOLVER_HOST: resolver
      RESOLVER_PORT: "5353"
    ports:
      - "8000:8000"
    volumes:
      - dnsdata:/data
    depends_on:
      - resolver
      - auth
    restart: unless-stopped

volumes:
  dnsdata:
